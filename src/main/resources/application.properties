
spring.application.name=supplychain

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/supplychain_db
spring.datasource.username=supplychain_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ethereum Blockchain Configuration
ethereum.rpc-url=${ETHEREUM_RPC_URL}
ethereum.contract-address=0xb8D9da6bb643DC05329908B46bB5caFd9363e3aC
ethereum.chain-id=11155111
